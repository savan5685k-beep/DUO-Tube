name: Build DUO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The main and manual QA workflows share one cached debug keystore. Serialize
# builds so a cache miss cannot create two competing signing identities.
concurrency:
  group: duo-qa-apk-signing
  cancel-in-progress: false

jobs:
  build:
    name: Compile, test, and package installable QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore stable QA debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: duo-qa-debug-signing-v1

      - name: Create QA debug key on first run
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null

      - name: Build optimized QA APKs (stable debug-signed, .qa package)
        run: ./gradlew :app:assembleQa --no-parallel --stacktrace

      - name: Collect and verify APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk/qa -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)" || { echo "No QA APKs found"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          apkanalyzer=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -1)
          [ -n "$apksigner" ] && [ -n "$apkanalyzer" ] || { echo "Android verification tools not found"; exit 1; }
          expected_cert_sha256=491877412845f1874c2003b9ebc0db3895859d0c95f1421a36be3344efc99862
          for apk in dist/*.apk; do
            report=$("$apksigner" verify --verbose --print-certs "$apk")
            echo "$report"
            cert_sha256=$(printf '%s\n' "$report" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')
            if [ "$cert_sha256" != "$expected_cert_sha256" ]; then
              echo "::error::$apk is not signed with the pinned QA debug certificate"
              exit 1
            fi
            package_id=$("$apkanalyzer" manifest application-id "$apk")
            echo "$apk package: $package_id"
            case "$package_id" in
              *.qa) ;;
              *) echo "::error::$apk is not a QA-suffixed package"; exit 1 ;;
            esac
          done
          ls -lh dist

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest desktopTest :desktopApp:compileKotlinDesktop --stacktrace

      - name: Upload installable QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUO-QA-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build DUO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test, and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest desktopTest :desktopApp:compileKotlinDesktop --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

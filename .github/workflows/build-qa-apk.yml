name: Build APK (QA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimized QA APKs (debug-signed)
        run: ./gradlew :app:assembleQa --no-parallel --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/qa/*/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/qa/*.apk dist/ 2>/dev/null || true
          test -n "$(find dist -name '*.apk' -print -quit)" || { echo "No QA APKs found"; exit 1; }
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: DUO-QA-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
